<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rakuen Software</title>
    <meta
      name="description"
      content="AI working environments, Linux appliances and independent systems components. Explore aimee, ouroboros-ring and the Smooth platform."
    />
    <script>
      // Same first-paint contract as SmoothGUI's themePreloadScript().
      (function () {
        try {
          var theme = localStorage.getItem('sg-theme');
          var previous = localStorage.getItem('rakuen-theme');
          if (theme !== 'light' && theme !== 'dark' && (previous === 'light' || previous === 'dark')) {
            theme = previous;
            localStorage.setItem('sg-theme', theme);
          }
          if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
        } catch (e) { /* The OS preference still works when storage is blocked. */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
