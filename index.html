<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rakuen Software</title>
    <meta
      name="description"
      content="Linux storage, routing and AI tooling. SmoothNAS, SmoothFS, SmoothRouter, nonraid, aimee and the Smooth* platform, built on tools you already run."
    />
    <script>
      // Applies the theme before first paint so visitors never see a theme
      // flash. Mirrors activeTheme() in src/lib/theme.ts — keep both in step,
      // including the storage key.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('rakuen-theme');
        } catch (e) {
          /* storage blocked: fall through to the dark default */
        }
        var dark = stored !== 'light';
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
